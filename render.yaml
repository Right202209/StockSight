services:
  - type: web
    name: stocksight-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        # update to the frontend URL after first deploy
        value: https://stocksight-frontend.onrender.com
      - key: DATABASE_URL
        value: sqlite:////tmp/stocksight.db
      - key: QUOTE_CACHE_TTL
        value: "30"
      - key: STOCK_DATA_PROVIDER
        value: yfinance

  - type: web
    name: stocksight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        # update to the backend URL after first deploy
        value: https://stocksight-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
